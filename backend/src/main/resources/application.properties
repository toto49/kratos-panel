spring.application.name=kratos-backend

# Connexion PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/kratos_db}
spring.datasource.username=${DB_USERNAME:kratos}
spring.datasource.password=${DB_PASSWORD:kratos_password}
spring.datasource.driver-class-name=org.postgresql.Driver
server.port=${SERVER_PORT:8081}

kratos.jwt.secret=${JWT_SECRET:dev-only-kratos-jwt-secret-change-before-production-64-bytes-minimum-2026}
kratos.jwt.expiration-ms=${JWT_EXPIRATION_MS:900000}
kratos.jwt.issuer=${JWT_ISSUER:kratos-panel}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
