spring.application.name=kratos-backend

# Connexion PostgreSQL au conteneur Docker
spring.datasource.url=jdbc:postgresql://localhost:5432/kratos_db
spring.datasource.username=kratos
spring.datasource.password=kratos_password
spring.datasource.driver-class-name=org.postgresql.Driver
server.port=8081
# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true