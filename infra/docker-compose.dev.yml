services:
  postgres:
    image: postgres:16-alpine
    container_name: kratos-postgres
    environment:
      POSTGRES_DB: kratos_db
      POSTGRES_USER: kratos
      POSTGRES_PASSWORD: kratos_password
    ports:
      - "5432:5432"
    volumes:
      - kratos_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  kratos_data: