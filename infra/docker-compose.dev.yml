services:
  postgres:
    image: postgres:16-alpine
    container_name: kratos-postgres
    environment:
      POSTGRES_DB: kratos_db
      POSTGRES_USER: kratos
      POSTGRES_PASSWORD: kratos_default_password_change_me
    volumes:
      - kratos_data:/var/lib/postgresql/data
    restart: unless-stopped

  backend:
    image: ghcr.io/ton-github/kratos-backend:latest
    container_name: kratos-backend
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=kratos_db
      - DB_USER=kratos
      - DB_PASSWORD=kratos_default_password_change_me
    ports:
      - "8081:8081"
    depends_on:
      - postgres
    restart: unless-stopped

volumes:
  kratos_data: